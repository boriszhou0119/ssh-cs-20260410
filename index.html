<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>待办事项</h1>
      <p class="subtitle">今日事，今日毕</p>
    </header>

    <section class="input-section">
      <input type="text" id="todo-input" placeholder="添加新任务..." maxlength="100" autocomplete="off">
      <button type="button" id="add-btn" aria-label="添加任务">添加</button>
    </section>

    <section class="filter-section">
      <button type="button" class="filter-btn active" data-filter="all">全部</button>
      <button type="button" class="filter-btn" data-filter="active">未完成</button>
      <button type="button" class="filter-btn" data-filter="completed">已完成</button>
    </section>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="app-footer">
      <span id="count-text">0 项待办</span>
      <button type="button" id="clear-completed" class="clear-btn">清除已完成</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
